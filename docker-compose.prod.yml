# Déploiement on-premise (serveur dédié) : étend docker-compose.yml avec les
# services api/web construits depuis les Dockerfiles existants (déjà utilisés
# pour les images Cloud Run). Variables lues depuis un fichier .env à la racine
# du projet (convention par défaut de `docker compose`).
#
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pouetpouet_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    volumes:
      - api_uploads:/app/.uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    container_name: pouetpouet_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api_uploads:
